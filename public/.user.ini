; =====================================================================
;  Limites PHP — hébergement mutualisé OVH
;
;  OVH lit ce fichier automatiquement (pas besoin d'accès SSH ni root).
;  Sans lui, les valeurs par défaut sont souvent trop basses pour
;  uploader une photo de téléphone (2 Mo) ou une vidéo de fond, et la
;  requête expire sans message d'erreur — l'upload « tourne » sans fin.
;
;  Après modification, OVH peut mettre quelques minutes à la prendre
;  en compte (cache de configuration PHP).
; =====================================================================

; Photos de réalisations/galeries : 5 Mo max côté application.
; Vidéo de fond du hero : 50 Mo max côté application.
upload_max_filesize = 64M

; Doit rester supérieur à upload_max_filesize (le POST contient le
; fichier + les autres champs du formulaire).
post_max_size = 72M

; Un upload de 50 Mo sur une connexion lente dépasse largement les
; 30 secondes par défaut.
max_execution_time = 300
max_input_time = 300

memory_limit = 256M
